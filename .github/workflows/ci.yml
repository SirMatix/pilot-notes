name: pilot-ci
on: [pull_request]
permissions:
  contents: read
jobs:
  unit-and-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --no-deps .
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
      - run: python -B -m unittest discover -s tests/acceptance -p 'test_*.py'
      - run: test "$(pilot-notes normalize '  Hello   World ')" = 'Hello World'
